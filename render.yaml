# Despliegue en Render (Blueprint): New + > Blueprint > selecciona este repo.
services:
  - type: web
    name: cargobox
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: cargobox-db, property: connectionString}
      - key: SEED_DEMO
        value: "true"
databases:
  - name: cargobox-db
    plan: free
