services:
  # Servicio de la Base de Datos PostgreSQL (para la persistencia del sistema)
  db:
    image: postgres:15-alpine
    container_name: cargobox_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cargobox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cargobox_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio de la Aplicación y Pruebas
  app:
    build: .
    container_name: cargobox_app
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/cargobox_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: pytest tests/test_casos_pia.py --cov=src --cov-report=term-missing

volumes:
  postgres_data: